<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>에게</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:white; --bg2:DarkGreen;
    --ink:Maroon; --soft:RosyBrown;
    --sheet:white; --line:Snow;
  }
  html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);
    background:radial-gradient(150% 110% at 50% 40%, var(--bg1) 55%, color-mix(in srgb, var(--bg2) 40%, var(--bg1)));
    font-family:'Nanum Gothic', sans-serif;
    -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}

  header{position:fixed;top:0;left:0;right:0;text-align:center;pointer-events:none;
    padding:calc(env(safe-area-inset-top) + 28px) 16px 0;}
  h1{margin:0;font-weight:400;font-size:28px;letter-spacing:.02em;}
  .sub{margin-top:4px;font-size:17px;font-style:normal;color:var(--soft);}

  #hint{position:fixed;left:0;right:0;text-align:center;pointer-events:none;
    bottom:calc(env(safe-area-inset-bottom) + 24px);font-size:16px;font-style:normal;color:var(--soft);
    transition:opacity .6s;animation:breathe 2.4s ease-in-out infinite;}
  #hint.gone{opacity:0;animation:none;}
  @keyframes breathe{50%{opacity:.45}}

  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    font-style:normal;color:var(--soft);font-size:18px;transition:opacity .5s;pointer-events:none;}
  #loading.done{opacity:0;}

  #backdrop{position:fixed;inset:0;background:rgba(45,28,22,.28);opacity:0;pointer-events:none;transition:opacity .3s;}
  #backdrop.open{opacity:1;pointer-events:auto;}

  #sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;
    background:var(--sheet);border-radius:8px 8px 0 0;box-shadow:0 -12px 40px rgba(60,35,25,.18);
    padding:10px 16px calc(env(safe-area-inset-bottom) + 22px);max-height:86vh;overflow-y:auto;
    transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);box-sizing:border-box;}
  #sheet.open{transform:none;}
  .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px;}
  #close{position:absolute;top:10px;right:12px;width:36px;height:36px;border:0;border-radius:50%;
    background:transparent;color:var(--soft);font-size:26px;line-height:1;cursor:pointer;}
  .photo{width:100%;aspect-ratio:4/5;border-radius:4px;overflow:hidden;background:var(--line);}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .ph{width:100%;height:100%;display:flex;align-items:flex-end;padding:14px;box-sizing:border-box;
    color:#fff;font-size:15px;font-style:normal;}
  #title{margin:16px 0 2px;font-size:26px;font-weight:500;}
  #note{margin:0;font-size:17px;font-style:normal;color:var(--soft);}
  #msg{margin:14px 0 0;font-size:19px;line-height:1.5;white-space:pre-line;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<header>
  <h1>생일 축하해</h1>
  <div class="sub">도영이 모은 꽃</div>
</header>

<div id="loading">꽃 모으는 중...</div>
<div id="hint">꽃 고르기</div>

<div id="backdrop"></div>
<div id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <button id="close" aria-label="Close">×</button>
  <div class="photo" id="photoWrap">
    <img id="img" alt="">
    <div class="ph" id="ph" hidden></div>
  </div>
  <h2 id="title"></h2>
  <p id="note"></p>
  <p id="msg" hidden></p>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* =========================================================
   여기만 고치면 돼
   ---------------------------------------------------------
   MODEL : 네 Blender 꽃다발 파일 (.glb). null이면 임시 꽃으로 표시
   FLOWERS:
     mesh    - Blender에서 붙인 꽃 오브젝트 이름 (GLB 쓸 때 필요)
     title   - 팝업 제목
     photo   - 사진 경로 (photos 폴더에 넣기). null이면 사진 없이 메시지만
     note    - 날짜/장소 같은 한 줄
     message - (선택) 긴 메시지. 편지 넣을 꽃에 쓰기
     type, color - 임시 꽃 모양/색 (GLB 쓰면 무시됨)
   ========================================================= */
const MODEL = null; // 예: 'bouquet.glb'
const ROTATE_SPEED = 1.0;
const BOUQUET_Y = 0.1;

const FLOWERS = [
  { id:'heart', mesh:'center_flower', title:'에게', photo:null, note:'',
    message:'생일 축하해요!\n처음으로 같이 보내는 생일\n같이 못 있어서 아쉽다. 그치?\n곧 진짜 꽃으로 줄게.\n얼른 봐요.\n사랑해요.',
    type:'rose', color:'#c8324a' },
  { id:'f1', mesh:'flower_01', title:'Rose',      photo:'photos/01.jpg', note:'Seoul · May 2026',     type:'rose',      color:'#e7899a' },
  { id:'f2', mesh:'flower_02', title:'Daisy',     photo:'photos/02.jpg', note:'Farnham · June 2026',  type:'daisy',     color:'#ffffff' },
  { id:'f3', mesh:'flower_03', title:'Tulip',     photo:'photos/03.jpg', note:'London · April 2026',  type:'tulip',     color:'#f0a64a' },
  { id:'f4', mesh:'flower_04', title:'Hydrangea', photo:'photos/04.jpg', note:'Seoul · July 2026',    type:'hydrangea', color:'#8fa6e0' },
  { id:'f5', mesh:'flower_05', title:'Anemone',   photo:'photos/05.jpg', note:'Somewhere · 2026',     type:'anemone',   color:'#b07cc6' },
  { id:'f6', mesh:'flower_06', title:'Cosmos',    photo:'photos/06.jpg', note:'Somewhere · 2026',     type:'daisy',     color:'#f3b7cf' },
  { id:'f7', mesh:'flower_07', title:'Tulip',     photo:'photos/07.jpg', note:'Somewhere · 2026',     type:'tulip',     color:'#f6d6e0' },
];
/* ========================================================= */

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);

scene.add(new THREE.HemisphereLight(0xfff4ec, 0xb5a297, 1.7));
const key = new THREE.DirectionalLight(0xffffff, 1.7); key.position.set(3, 5, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0xffe2d0, 0.8); rim.position.set(-4, 2, -4); scene.add(rim);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = ROTATE_SPEED;
controls.minDistance = 4;
controls.maxDistance = 14;
controls.minPolarAngle = 0.5;
controls.maxPolarAngle = 2.0;
controls.target.set(0, 0, 0);

const root = new THREE.Group();
scene.add(root);

/* ---------- 임시 꽃 만들기 ---------- */
const sphereGeo = new THREE.SphereGeometry(1, 16, 12);
const mat = (color, extra={}) => new THREE.MeshStandardMaterial({ color, roughness:.6, side:THREE.DoubleSide, ...extra });
const GREEN = '#5f8a4f';

function petalRing(g, { n, r, tilt, len, wid, thick=.04, y=0, color, offset=0 }) {
  const m = mat(color);
  for (let i = 0; i < n; i++) {
    const pivot = new THREE.Group();
    pivot.rotation.y = (i / n) * Math.PI * 2 + offset;
    const p = new THREE.Mesh(sphereGeo, m);
    p.scale.set(wid, thick, len);
    p.rotation.x = -tilt;
    p.position.set(0, y + Math.sin(tilt) * len * .9, r + Math.cos(tilt) * len * .9);
    pivot.add(p); g.add(pivot);
  }
}
function ball(g, r, color, y=0, sy=1) {
  const b = new THREE.Mesh(sphereGeo, mat(color)); b.scale.set(r, r * sy, r); b.position.y = y; g.add(b);
}

function makeHead(type, color) {
  const g = new THREE.Group();
  const c = new THREE.Color(color);
  const darker = c.clone().multiplyScalar(.75);
  switch (type) {
    case 'daisy':
      petalRing(g, { n:16, r:.12, tilt:.15, len:.32, wid:.09, thick:.03, color });
      ball(g, .15, '#f2c230', .02, .55);
      break;
    case 'anemone':
      petalRing(g, { n:8, r:.08, tilt:.35, len:.3, wid:.19, thick:.035, color });
      ball(g, .13, '#2d2440', .04, .7);
      break;
    case 'tulip':
      petalRing(g, { n:3, r:.03, tilt:1.3, len:.3, wid:.17, thick:.05, color });
      petalRing(g, { n:3, r:.05, tilt:1.25, len:.3, wid:.17, thick:.05, color:darker, offset:Math.PI/3 });
      break;
    case 'hydrangea':
      for (let i = 0; i < 46; i++) {
        const u = Math.random(), v = Math.random() * .55;
        const th = u * Math.PI * 2, ph = Math.acos(1 - v);
        const s = new THREE.Mesh(sphereGeo, mat(i % 3 ? color : darker));
        s.scale.setScalar(.07);
        s.position.set(Math.sin(ph) * Math.cos(th) * .32, Math.cos(ph) * .32 - .1, Math.sin(ph) * Math.sin(th) * .32);
        g.add(s);
      }
      break;
    default: // rose
      ball(g, .09, darker, .12, 1.2);
      petalRing(g, { n:5, r:.04, tilt:1.25, len:.16, wid:.13, thick:.05, color:darker });
      petalRing(g, { n:6, r:.08, tilt:.95, len:.22, wid:.17, thick:.05, color, offset:.3 });
      petalRing(g, { n:7, r:.12, tilt:.6,  len:.27, wid:.2,  thick:.05, color, offset:.6 });
  }
  return g;
}

function buildPlaceholder() {
  const base = new THREE.Vector3(0, -1.6, 0);
  const up = new THREE.Vector3(0, 1, 0);
  const stemMat = mat(GREEN);
  const golden = Math.PI * (3 - Math.sqrt(5));

  FLOWERS.forEach((f, i) => {
    const flower = new THREE.Group();
    const tilt = i === 0 ? 0 : .3 + .14 * (i % 2);
    const az = i * golden;
    const L = i === 0 ? 2.75 : 2.55 - (i % 2) * .25;

    const stem = new THREE.Mesh(new THREE.CylinderGeometry(.025, .03, L, 8), stemMat);
    stem.position.y = L / 2; flower.add(stem);
    const head = makeHead(f.type, f.color);
    head.position.y = L; flower.add(head);

    const dir = new THREE.Vector3(Math.sin(tilt) * Math.cos(az), Math.cos(tilt), Math.sin(tilt) * Math.sin(az));
    flower.quaternion.setFromUnitVectors(up, dir);
    flower.position.copy(base);
    flower.userData.flowerId = f.id;
    root.add(flower);
  });

  // leaves
  const leafMat = mat('#6f9a5b');
  for (let i = 0; i < 7; i++) {
    const pivot = new THREE.Group();
    pivot.position.set(0, -.35, 0);
    pivot.rotation.y = i / 7 * Math.PI * 2 + .2;
    const leaf = new THREE.Mesh(sphereGeo, leafMat);
    leaf.scale.set(.13, .025, .5);
    leaf.rotation.x = -.75;
    leaf.position.set(0, Math.sin(.75) * .45, .55 + Math.cos(.75) * .45);
    pivot.add(leaf); root.add(pivot);
  }

  // wrapping paper
  const wrap = new THREE.Mesh(new THREE.CylinderGeometry(1.0, .18, 1.7, 40, 1, true),
    mat('#efe2d1', { roughness:.95 }));
  wrap.position.y = -1.05; root.add(wrap);
  const inner = new THREE.Mesh(new THREE.CylinderGeometry(.98, .17, 1.68, 40, 1, true),
    mat('#d9b9a8', { roughness:.95, side:THREE.BackSide }));
  inner.position.y = -1.05; root.add(inner);

  // ribbon
  const ribbon = new THREE.Mesh(new THREE.TorusGeometry(.41, .045, 10, 40), mat('#b8485c', { roughness:.4 }));
  ribbon.rotation.x = Math.PI / 2; ribbon.position.y = -1.45; root.add(ribbon);

  // stem ends
  const ends = new THREE.Mesh(new THREE.CylinderGeometry(.12, .1, .6, 12), stemMat);
  ends.position.y = -2.15; root.add(ends);

  root.position.y = BOUQUET_Y;
  done();
}

/* ---------- GLB 불러오기 ---------- */
function loadModel() {
  new GLTFLoader().load(MODEL, (gltf) => {
    const m = gltf.scene;
    const box = new THREE.Box3().setFromObject(m);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const s = 3.8 / Math.max(size.x, size.y, size.z);
    m.scale.setScalar(s);
    m.position.copy(center).multiplyScalar(-s);
    FLOWERS.forEach(f => {
      const o = m.getObjectByName(f.mesh);
      if (o) o.userData.flowerId = f.id;
      else console.warn('Blender에서 이 이름의 오브젝트를 못 찾음:', f.mesh);
    });
    root.add(m);
    root.position.y = BOUQUET_Y;
    done();
  }, undefined, (err) => {
    console.warn('GLB 로드 실패, 임시 꽃으로 표시:', err);
    buildPlaceholder();
  });
}

function done() { document.getElementById('loading').classList.add('done'); }

MODEL ? loadModel() : buildPlaceholder();

/* ---------- 탭해서 꽃 고르기 ---------- */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let down = null;

canvas.addEventListener('pointerdown', e => { down = { x:e.clientX, y:e.clientY, t:performance.now() }; });
canvas.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  const quick = performance.now() - down.t < 450;
  down = null;
  if (moved < 10 && quick) pick(e.clientX, e.clientY);
});

function pick(x, y) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((x - r.left) / r.width) * 2 - 1, -((y - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObject(root, true)[0];
  if (!hit) return;
  let o = hit.object;
  while (o && !o.userData.flowerId) o = o.parent;
  if (o) openFlower(o.userData.flowerId, o);
}

/* ---------- 팝업 ---------- */
const $ = id => document.getElementById(id);
const sheet = $('sheet'), backdrop = $('backdrop'), img = $('img'), ph = $('ph');

img.addEventListener('error', () => { img.hidden = true; ph.hidden = false; });

function openFlower(id, obj) {
  const f = FLOWERS.find(x => x.id === id);
  if (!f) return;
  pulse(obj);
  $('title').textContent = f.title || '';
  $('note').textContent = f.note || '';
  $('msg').textContent = f.message || '';
  $('msg').hidden = !f.message;

  if (f.photo) {
    $('photoWrap').hidden = false;
    img.hidden = false; ph.hidden = true;
    img.removeAttribute('src');
    img.src = f.photo;
    ph.style.background = `linear-gradient(160deg, ${f.color}, #3b2f2b)`;
    ph.textContent = f.photo;
  } else {
    $('photoWrap').hidden = true;
  }
  sheet.scrollTop = 0;
  sheet.classList.add('open'); backdrop.classList.add('open');
  controls.autoRotate = false;
  $('hint').classList.add('gone');
}
function closeSheet() {
  sheet.classList.remove('open'); backdrop.classList.remove('open');
  controls.autoRotate = true;
}
backdrop.addEventListener('click', closeSheet);
$('close').addEventListener('click', closeSheet);

// 아래로 쓸어내려서 닫기
let sy = null;
sheet.addEventListener('touchstart', e => { sy = sheet.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive:true });
sheet.addEventListener('touchend', e => {
  if (sy !== null && e.changedTouches[0].clientY - sy > 80) closeSheet();
  sy = null;
});

/* ---------- 꽃 톡 튀는 효과 ---------- */
const pulses = [];
function pulse(o) {
  if (!o.userData.base) o.userData.base = o.scale.clone();
  pulses.push({ o, t:0 });
}

/* ---------- 화면 크기 ---------- */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const dist = camera.aspect < .75 ? 10.5 : 8;
  const dir = camera.position.lengthSq() ? camera.position.clone().normalize() : new THREE.Vector3(0, .15, 1).normalize();
  camera.position.copy(dir.multiplyScalar(dist));
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

/* ---------- 루프 ---------- */
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i]; p.t += dt;
    const k = Math.sin(Math.min(p.t / .45, 1) * Math.PI) * .18;
    p.o.scale.copy(p.o.userData.base).multiplyScalar(1 + k);
    if (p.t >= .45) { p.o.scale.copy(p.o.userData.base); pulses.splice(i, 1); }
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
